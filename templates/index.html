<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Cutting Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Fruit Samurai</h1>

        <!-- Start Game Button -->
        <button id="startButton">Start Game</button>

        <!-- Game Over Message -->
        <div id="gameOverMessage" class="hidden">
            <p id="finalScore" class="hidden">Game Over! Final Score: <span>0</span></p>
            <!-- <p id="restartButtonParagraph" class="hidden"><button id="restartButton" class="hidden">Restart Game</button></p> -->
        </div>

        <!-- Video Feed (Webcam) -->
        <img id="gameCanvas" src="{{ url_for('video_feed') }}" alt="Game Video Feed" class="hidden"> <!-- Hide initially -->
    </div>

    <script>
        // Start Game Button
        document.getElementById('startButton').addEventListener('click', function() {
            fetch('/start_game', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                console.log(data.message);  // Log game start message5
                document.getElementById('startButton').classList.add('hidden');  // Hide start button
                document.getElementById('gameCanvas').classList.remove('hidden');  // Show video feed when the game starts
            })
            .catch(error => console.error('Error starting the game:', error));
        });

        // // Restart Game Button
        // document.getElementById('restartButton').addEventListener('click', function() {
        //     fetch('/start_game', {
        //         method: 'POST'
        //     })
        //     .then(response => response.json())
        //     .then(data => {
        //         console.log(data.message);  // Log game restart message
        //         document.getElementById('score').classList.remove('hidden');

        //         document.getElementById('gameOverMessage').classList.add('hidden');  // Hide game over message
        //         document.getElementById('finalScore').classList.add('hidden');
        //         document.getElementById('restartButton').classList.add('hidden');  // Show restart button
        //         document.getElementById('restartButtonParagraph').classList.add('hidden');  // Show restart button
        //     })
        //     .catch(error => console.error('Error restarting the game:', error));
        // });

        // Function to show Game Over message
        function showGameOver(finalScore) {
            document.getElementById('gameCanvas').classList.add('hidden');  // Hide video feed when game is over
            
            document.getElementById('finalScore').textContent = finalScore;
            document.getElementById('gameOverMessage').classList.remove('hidden');
            document.getElementById('startButton').classList.remove('hidden');  // Show the start button again
            
            document.getElementById('restartButton').classList.remove('hidden');  // Show restart button
            document.getElementById('restartButtonParagraph').classList.remove('hidden');  // Show restart button
        }

        // Fetch the game over state and score from backend after game ends
        fetch('/game_over')
            .then(response => response.json())
            .then(data => {
                if (data.game_over) {
                    showGameOver(data.final_score);  // Show the final score on Game Over
                }
            });
    </script>
</body>
</html>
